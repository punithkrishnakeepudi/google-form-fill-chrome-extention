<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --raise: #f7f7f9; --fg: #1f1f23; --muted: #6b6b76;
    --line: #e4e4e9; --accent: #6b4ee6; --accent-fg: #fff; --accent-weak: #f2eeff;
    --warn: #8a5a00; --warn-bg: #fff9ef; --warn-line: #f0d9ad;
    --ok: #0f7b4f; --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1d21; --raise: #26262c; --fg: #e9e9ec; --muted: #9b9ba6;
      --line: #35353d; --accent: #a894ff; --accent-fg: #1a1430; --accent-weak: #2a2440;
      --warn: #e8b765; --warn-bg: #2b2518; --warn-line: #4a3c21;
      --ok: #6fd3a3;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 360px; max-height: 560px; margin: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .mark { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
  .mark svg { width: 15px; height: 15px; }
  header strong { display: block; font-size: 13px; }
  #sub { display: block; font-size: 11.5px; color: var(--muted); }
  #sub.ok { color: var(--ok); }
  #sub.warn { color: var(--warn); }

  main { overflow-y: auto; padding: 4px 14px 14px; }
  section { margin-top: 14px; }
  .sechead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  /* display:flex drops the built-in triangle, so draw our own. */
  summary.sechead { cursor: pointer; list-style: none; }
  summary.sechead::-webkit-details-marker { display: none; }
  summary.sechead::after { content: "›"; margin-left: auto; font-size: 15px; line-height: 1; color: var(--muted); transform: rotate(90deg); }
  details[open] summary.sechead::after { transform: rotate(-90deg); }
  h2 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .chip { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 99px; background: var(--raise); color: var(--muted); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }

  .row { margin-bottom: 7px; }
  .lab { display: block; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
  #fields .lab { text-transform: capitalize; }
  input {
    width: 100%; margin-top: 3px; padding: 7px 9px; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  }
  input::placeholder { color: var(--muted); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Questions this form asked that we had no answer for. */
  .needs { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 12px 4px; }
  .needs input { background: var(--bg); }
  .needs .row:last-child { margin-bottom: 10px; }

  #extra .row { display: flex; flex-direction: column; gap: 3px; }
  #extra input { margin-top: 0; }

  button { font: inherit; padding: 8px 14px; border-radius: var(--radius); cursor: pointer; }
  .ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .ghost:hover { background: var(--raise); }
  .primary { flex: 1; background: var(--accent); color: var(--accent-fg); border: 1px solid transparent; font-weight: 600; }
  .primary:hover { filter: brightness(1.08); }
  #add { width: 100%; color: var(--muted); border-style: dashed; }

  .hint { margin: 14px 0 0; font-size: 11px; color: var(--muted); }
  footer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg); }
</style>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8.5 13.5l2.5 2.5 4.5-5"/>
      </svg>
    </span>
    <div>
      <strong>Form Autofill</strong>
      <span id="sub" role="status">Checking this page…</span>
    </div>
  </header>

  <main>
    <section id="missing-sec" hidden>
      <div class="sechead"><h2>Needs an answer</h2><span class="chip warn" id="n-missing"></span></div>
      <div class="needs" id="missing"></div>
    </section>

    <section>
      <details id="mine" open>
        <summary class="sechead"><h2>My details</h2><span class="chip" id="n-fields"></span></summary>
        <div id="fields"></div>
      </details>
    </section>

    <section>
      <div id="extra"></div>
      <button id="add" class="ghost">+ Add a question</button>
    </section>

    <p class="hint">Clear a box to forget that answer. For a question with several boxes ticked, separate the answers with “;”.</p>
  </main>

  <footer>
    <button id="save" class="primary">Save &amp; fill</button>
    <button id="copy" class="ghost" title="Copy every saved answer as JSON">Copy all</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
